name: "Scenario A: removes-dummy branch + no project .npmrc"

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout package
        uses: actions/checkout@v4
        with:
          repository: chiranjib-swain/repro-setup-node-oidc
          path: package

      - name: Checkout patched npm-cli
        uses: actions/checkout@v4
        with:
          repository: chiranjib-swain/npm-cli
          ref: envReplace
          path: npm-cli

      - name: Setup node with removes-dummy branch
        uses: gowridurgad/setup-node@removes-dummy
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install patched npm
        run: cd npm-cli && npm install && npm install -g .

      - name: Show state before publish
        run: |
          echo "NODE_AUTH_TOKEN='$NODE_AUTH_TOKEN'"
          echo "--- userconfig ($NPM_CONFIG_USERCONFIG) ---"
          cat "$NPM_CONFIG_USERCONFIG"
          echo "--- package .npmrc ---"
          cat package/.npmrc 2>/dev/null || echo "(none)"

      - name: Publish dry-run
        working-directory: package
        run: npm publish --access public --dry-run --loglevel verbose 2>&1 | tee /tmp/publish.log
        continue-on-error: true

      - name: DETECT results
        run: |
          grep '\[DETECT\]' /tmp/publish.log || echo "No DETECT lines"
          echo "---"
          grep -E 'tokenChanged|ENEEDAUTH|dry-run|E40' /tmp/publish.log || true