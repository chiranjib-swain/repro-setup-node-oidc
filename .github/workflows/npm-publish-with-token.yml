name: Publish to npmjs with Yarn v1 (no env expansion in .npmrc)

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: Satishchoudhary94/setup-node@fix/oidc-support-1440
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - run: yarn install
        env:
          # some projects still expect NODE_AUTH_TOKEN, but the auth is in ~/.npmrc now
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # For Yarn v1, use yarn publish (NOT yarn npm publish)
      - run: yarn publish --access public --non-interactive
        env:
          # some projects still expect NODE_AUTH_TOKEN, but the auth is in ~/.npmrc now
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}