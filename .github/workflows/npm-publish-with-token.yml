name: "Scenario H: New fix + no OIDC + token in later step"
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write #— OIDC env vars will not be set
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chiranjib-swain/repro-setup-node-oidc
          path: package
      - uses: actions/checkout@v4
        with:
          repository: chiranjib-swain/npm-cli
          ref: envReplace
          path: npm-cli
      # - uses: chiranjib-swain/setup-node@oidc-fix-haritha
      - name: Setup node with removes-dummy branch
        uses: Satishchoudhary94/setup-node@fix/oidc-support-1440
        with:
          node-version: '24'
          # registry-url: 'https://registry.npmjs.org'
        # NODE_AUTH_TOKEN intentionally NOT set here
      - run: cd npm-cli && npm install && npm install -g .
      - name: Show state (NODE_AUTH_TOKEN should be absent/unset)
        run: |
          echo "NODE_AUTH_TOKEN='$NODE_AUTH_TOKEN'"
          echo "--- userconfig (should have literal placeholder) ---"
          cat "$NPM_CONFIG_USERCONFIG"
      - name: Publish dry-run (token set HERE — later step pattern)
        working-directory: package
        run: npm publish --access public  --loglevel verbose 2>&1 | tee /tmp/publish.log
        continue-on-error: true
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}   # set only on publish step
      - name: DETECT results
        run: |
          grep '\[DETECT\]' /tmp/publish.log || echo "No DETECT lines"
          grep -E 'tokenChanged|ENEEDAUTH|dry-run|CI environment' /tmp/publish.log || true