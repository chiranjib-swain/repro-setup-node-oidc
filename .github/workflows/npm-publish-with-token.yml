name: Publish Package to npmjs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # ✅ Use your custom setup-node branch
      - uses: Satishchoudhary94/setup-node@fix/oidc-support-1440
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          scope: '@octocat'

      # ✅ Enable latest Yarn (instead of default v1.22.22)
      - name: Enable Corepack (Yarn latest)
        run: |
          corepack enable
          corepack prepare yarn@stable --activate
          yarn install
          git add yarn.lock .yarnrc.yml .yarn/
          git commit -m "Add Yarn lockfile for CI"
          git push

      - run: yarn install

      # ✅ Modern Yarn publish
      - run: yarn npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}