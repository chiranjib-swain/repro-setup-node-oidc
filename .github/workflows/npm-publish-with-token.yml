
name: Test Publish (NODE_AUTH_TOKEN set blank in OIDC mode)

on:
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
    
    - name: Setup node with removes-dummy branch
      uses: gowridurgad/setup-node@removes-dummy
      with:
        node-version: "24"
        registry-url: "https://registry.npmjs.org"
        package-manager-cache: false # Disable pnpm cache to avoid issues with authentication
    
    - run: pnpm install
    - run: pnpm build
    
    - name: Publish
      # env:
        # NODE_AUTH_TOKEN: ""
      run: pnpm publish --recursive --no-git-checks --verbose