
name: Test Publish (NODE_AUTH_TOKEN NOT cleared)

on:
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
    
    - name: Use Node.js 24
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
      with:
        node-version: "24.14.1"
        registry-url: "https://registry.npmjs.org"
        # cache: pnpm
        package-manager-cache: false
    
    - run: pnpm install
    - run: pnpm build

    - name: Check OIDC token availability
      run: |
        echo "Checking if OIDC id-token permission is granted..."
        OIDC_TOKEN=$(curl -s -o /dev/null -w "%{http_code}" \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sigstore")
        echo "OIDC token request HTTP status: $OIDC_TOKEN"
        if [ "$OIDC_TOKEN" = "200" ]; then
          echo "✅ OIDC id-token permission is available."
        else
          echo "❌ OIDC id-token permission is NOT available or request failed (status: $OIDC_TOKEN)."
          exit 1
        fi
    
    - name: Publish
      # env:
        # NODE_AUTH_TOKEN: ""
      run: pnpm publish --recursive --no-git-checks --verbose
