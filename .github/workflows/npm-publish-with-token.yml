
name: Test Publish (NODE_AUTH_TOKEN NOT cleared)

on:
  workflow_dispatch:

# permissions:
#   id-token: write # Required for OIDC
#   contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
    
    - name: Use Node.js 24
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
      with:
        node-version: "24.14.1"
        registry-url: "https://registry.npmjs.org"
        # cache: pnpm
        package-manager-cache: false # Disable caching to isolate publish behavior
    
    - run: pnpm install
    - run: pnpm build
    
    - name: Read version and publish
      run: |
        VERSION=$(node -p "require('./package.json').version")
        echo "Publishing version $VERSION to npm..."
        if [[ "$VERSION" == *alpha* || "$VERSION" == *beta* ]]; then
            pnpm publish --recursive --no-git-checks --tag beta
          else
            pnpm publish --recursive --no-git-checks
          fi
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
