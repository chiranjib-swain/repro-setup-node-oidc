name: Repro dummy token override

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC token exchange

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show project .npmrc (confirm dummy token is here)
        run: cat .npmrc

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # intentionally NOT setting node-auth-token so setup-node injects XXXXX-XXXXX-XXXXX-XXXXX

      - name: Show setup-node's userconfig (confirm dummy token is also here)
        run: cat "$NPM_CONFIG_USERCONFIG"

      - name: Show which layer wins before publish
        run: |
          echo "NODE_AUTH_TOKEN=$NODE_AUTH_TOKEN"
          echo "--- userconfig contents ---"
          cat "$NPM_CONFIG_USERCONFIG"
          echo "--- project .npmrc contents ---"
          cat .npmrc

      - name: Publish (expect 400 OIDC publish authorize Invalid token)
        run: npm publish --access public
