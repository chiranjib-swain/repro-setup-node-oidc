name: "Scenario C: setup-node@v6 (XXXXX) + project .npmrc (current state)"

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout package
        uses: actions/checkout@v4
        with:
          repository: chiranjib-swain/repro-setup-node-oidc
          path: package

      - name: Checkout patched npm-cli
        uses: actions/checkout@v4
        with:
          repository: chiranjib-swain/npm-cli
          ref: envReplace
          path: npm-cli

      - name: Setup node with official v6 (exports XXXXX dummy)
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install patched npm
        run: cd npm-cli && npm install && npm install -g .

      - name: Add project .npmrc
        run: |
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > package/.npmrc
          echo "NODE_AUTH_TOKEN='$NODE_AUTH_TOKEN'"
          echo "--- userconfig ---"
          cat "$NPM_CONFIG_USERCONFIG"
          echo "--- package .npmrc ---"
          cat package/.npmrc

      - name: Publish dry-run (XXXXX is truthy → passes noCreds, tokenChanged=false)
        working-directory: package
        run: npm publish --access public --dry-run --loglevel verbose 2>&1 | tee /tmp/publish.log
        continue-on-error: true

      - name: DETECT results
        run: |
          echo "=== DETECT lines ==="
          grep '\[DETECT\]' /tmp/publish.log || echo "No DETECT lines"
          echo "=== Result ==="
          grep -E 'tokenChanged|ENEEDAUTH|dry-run|E40' /tmp/publish.log || true