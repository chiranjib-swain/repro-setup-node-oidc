name: test-yarn2-private-registry

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # ✅ Use your PR branch
      - uses: Satishchoudhary94/setup-node@fix/oidc-support-1440
        with:
          node-version: '24.x'

      # ✅ Enable Yarn modern (required!)
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@stable --activate
          yarn -v

      # ✅ Setup Yarn v2+ auth config
      - name: Setup .yarnrc.yml
        run: |
          yarn config set npmScopes.my-org.npmRegistryServer "https://npm.pkg.github.com"
          yarn config set npmScopes.my-org.npmAlwaysAuth true
          yarn config set npmScopes.my-org.npmAuthToken $NPM_AUTH_TOKEN
        env:
          NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ✅ Install
      - name: Install dependencies
        run: yarn install --no-immutable