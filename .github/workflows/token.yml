name: test-6-docs-npmrc-repro

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: Satishchoudhary94/setup-node@fix/oidc-support-1440
        with:
          node-version: '20.x'

      - name: Create docs-style npmrc
        run: |
          cat > /tmp/test.npmrc <<'EOF'
          registry=https://registry.npmjs.org/
          always-auth=true
          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          EOF

      - run: npm install -g yarn@1.22.22

      - name: Yarn install (expected failure)
        run: yarn install
        env:
          NPM_CONFIG_USERCONFIG: /tmp/test.npmrc