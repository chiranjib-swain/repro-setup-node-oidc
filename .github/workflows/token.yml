name: test-5-yarn-modern-no-token

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: Satishchoudhary94/setup-node@fix/oidc-support-1440
        with:
          node-version: '20.x'

      - run: |
          corepack enable
          corepack prepare yarn@stable --activate

      - run: yarn install --no-immutable