name: test-token-override

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node (no token set)
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      
      - name: Print token
        run: echo "NODE_AUTH_TOKEN=$NODE_AUTH_TOKEN"

      - name: Try npm whoami
        run: npm whoami
        continue-on-error: true
