name: test-token-override

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Set custom token BEFORE setup-node
        run: echo "NODE_AUTH_TOKEN=REAL_TOKEN_123" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Check token AFTER setup-node
        run: |
          echo "NODE_AUTH_TOKEN=$NODE_AUTH_TOKEN"
