name: test-yarn-publish-npmjs-gpr

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: Satishchoudhary94/setup-node@fix/oidc-support-1440
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # Use Yarn v1 (matches docs behavior)
      - run: npm install -g yarn@1.22.22

      - name: yarn publish (npmjs - dry run)
        run: yarn publish --non-interactive --dry-run --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Switch to GitHub Packages
      - uses: Satishchoudhary94/setup-node@fix/oidc-support-1440
        with:
          registry-url: 'https://npm.pkg.github.com'

      - name: yarn publish (GPR - dry run)
        run: yarn publish --non-interactive --dry-run --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}