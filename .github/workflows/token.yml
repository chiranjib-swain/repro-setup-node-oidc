name: test-token-override

on:
  workflow_dispatch:

jobs:
  with-dummy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create .npmrc with env reference
        run: |
          echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc

      - name: Inject dummy NODE_AUTH_TOKEN
        run: |
          echo "NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX" >> $GITHUB_ENV

      - name: Debug token
        run: echo "Token-> $NODE_AUTH_TOKEN"

      - name: Debug .npmrc
        run: |
          echo "----- .npmrc -----"
          cat ~/.npmrc

      - name: npm config list
        run: npm config list

      - name: Try npm install (WITH dummy token)
        run: |
          npm init -y
          npm install lodash
