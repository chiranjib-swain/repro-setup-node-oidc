name: Confirm npm env substitution

on:
  workflow_dispatch:

jobs:
  test-env-replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork/branch
        uses: actions/checkout@v4
        with:
          repository: chiranjib-swain/npm-cli
          ref: envReplace  # Change to your branch name

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Do NOT set NODE_AUTH_TOKEN here to test the dummy token fallback

      - name: Create .npmrc with env var
        run: echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > .npmrc

      - name: Show .npmrc and NODE_AUTH_TOKEN before npm run
        run: |
          echo ".npmrc contents:"
          cat .npmrc
          echo "NODE_AUTH_TOKEN: $NODE_AUTH_TOKEN"

      - name: Run npm command to trigger debug log
        run: node ./bin/npm-cli.js whoami || true

      - name: Show npm debug log (if exists)
        run: cat /home/runner/.npm/_logs/*-debug-*.log || true
