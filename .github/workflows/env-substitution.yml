name: Confirm npm env substitution

on:
  workflow_dispatch:

jobs:
  test-env-replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork/branch
        uses: actions/checkout@v4
        with:
          repository: chiranjib-swain/npm-cli
          ref: envReplace

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # If your CLI needs to be built, add a build step here
      # - name: Build CLI
      #   run: npm run build

      # - name: Set test env variable
      #   run: echo "NODE_AUTH_TOKEN=TEST-TOKEN-123" >> $GITHUB_ENV

      - name: Create .npmrc with env var
        run: echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > .npmrc

      - name: Run npm command to trigger debug log
        run: node ./bin/npm-cli.js whoami || true

      - name: Show debug output
        run: cat /tmp/npm-debug.log || true
