name: Publish to npmjs with Yarn v1 (no env expansion in .npmrc)

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: Satishchoudhary94/setup-node@fix/oidc-support-1440
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Create docs-style npmrc (contains ${NODE_AUTH_TOKEN})
        run: |
          cat > /tmp/docs-style.npmrc <<'EOF'
          registry=https://registry.npmjs.org/
          always-auth=true
          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          EOF
          echo "----- /tmp/docs-style.npmrc -----"
          cat /tmp/docs-style.npmrc

      - name: Yarn install using docs-style npmrc
        run: yarn install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: /tmp/docs-style.npmrc