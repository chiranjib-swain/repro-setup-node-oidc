name: verify-node-auth-token-fallback

on:
  workflow_dispatch:

jobs:
  no_explicit_token:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Setup Node with registry auth (no NODE_AUTH_TOKEN provided)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Show generated npmrc and exported env
        shell: bash
        run: |
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          echo "---- .npmrc ----"
          cat "$RUNNER_TEMP/.npmrc"
          echo "---------------"
          echo "NODE_AUTH_TOKEN=$NODE_AUTH_TOKEN"

          echo "Assert npmrc contains literal env placeholder"
          grep -F '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' "$RUNNER_TEMP/.npmrc"

          echo "Assert fallback token was exported by setup-node"
          test "$NODE_AUTH_TOKEN" = "XXXXX-XXXXX-XXXXX-XXXXX"

  explicit_token:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Setup Node with explicit NODE_AUTH_TOKEN
        uses: actions/setup-node@v5
        env:
          NODE_AUTH_TOKEN: my-real-token-123
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Verify explicit token is preserved
        shell: bash
        run: |
          echo "---- .npmrc ----"
          cat "$RUNNER_TEMP/.npmrc"
          echo "---------------"
          echo "NODE_AUTH_TOKEN=$NODE_AUTH_TOKEN"

          echo "Assert npmrc still references env var, not hardcoded token"
          grep -F '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' "$RUNNER_TEMP/.npmrc"

          echo "Assert explicit token was not replaced by fallback"
          test "$NODE_AUTH_TOKEN" = "my-real-token-123"
